<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Notas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tela de login -->
  <div id="login-screen" class="auth-screen">
    <div class="auth-card">
      <h1>Minhas Notas</h1>
      <p class="auth-success" id="login-success"></p>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required placeholder="seu@email.com">

        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" required placeholder="Sua senha">

        <button type="submit" class="btn btn-primary">Entrar</button>
        <p class="auth-error" id="login-error"></p>
      </form>
      <p class="auth-switch">Não tem conta? <a href="#" id="show-register">Registre-se</a></p>
    </div>
  </div>

  <!-- Tela de registro -->
  <div id="register-screen" class="auth-screen hidden">
    <div class="auth-card">
      <h1>Criar conta</h1>
      <form id="register-form">
        <label for="register-nome">Nome</label>
        <input type="text" id="register-nome" required placeholder="Seu nome">

        <label for="register-email">Email</label>
        <input type="email" id="register-email" required placeholder="seu@email.com">

        <label for="register-senha">Senha</label>
        <input type="password" id="register-senha" required placeholder="Crie uma senha">

        <button type="submit" class="btn btn-primary">Criar conta</button>
        <p class="auth-error" id="register-error"></p>
      </form>
      <p class="auth-switch">Já tem conta? <a href="#" id="show-login">Fazer login</a></p>
    </div>
  </div>

  <!-- App principal -->
  <div id="app" class="app hidden">
    <header class="app-header">
      <h1>Minhas Notas</h1>
      <div class="header-actions">
        <button id="btn-new-note" class="btn btn-primary">+ Nova nota</button>
        <button id="btn-logout" class="btn btn-secondary">Sair</button>
      </div>
    </header>

    <main class="app-main">
      <section id="notes-list" class="notes-list">
        <p class="empty-state" id="empty-state">Nenhuma nota ainda. Crie a primeira!</p>
      </section>
    </main>

    <!-- Modal de criação/edição -->
    <div id="note-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="modal-title">Nova nota</h2>
        <form id="note-form">
          <input type="hidden" id="note-id">
          <label for="note-titulo">Título</label>
          <input type="text" id="note-titulo" required maxlength="120" placeholder="Título da nota">

          <label for="note-conteudo">Conteúdo</label>
          <textarea id="note-conteudo" rows="8" placeholder="Escreva sua nota..."></textarea>

          <div class="modal-actions">
            <button type="button" id="btn-cancel" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
